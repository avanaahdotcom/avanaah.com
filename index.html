<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avanaah | Curated Lifestyle: Fashion, Shoes, Accessories &amp; Gadgets</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#fff;--fg:#0F1A33;--mut:#5A5149;--soft:#F5F2EE;--line:#E4DED6;--bd:#BDB4A8;--ac:#94691F;--inv:#0D1F45;--invt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1426;--fg:#F5F2EE;--mut:#BDB4A8;--soft:#14213D;--line:#26365A;--bd:#3A4C73;--ac:#D9A94F;--inv:#F5F2EE;--invt:#0B1426}}
:root[data-theme=dark]{--bg:#0B1426;--fg:#F5F2EE;--mut:#BDB4A8;--soft:#14213D;--line:#26365A;--bd:#3A4C73;--ac:#D9A94F;--inv:#F5F2EE;--invt:#0B1426}
html{scroll-padding-top:calc(130px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--fg);background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:101;background:var(--bg)}
a{color:inherit;text-decoration:none}a:hover{color:var(--ac)}
h1,h2,h3{margin:0;letter-spacing:-.03em;font-weight:800}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes fl{50%{transform:translateY(-10px)}}
.pg{animation:up .6s cubic-bezier(.2,.7,.2,1) both}
.w{max-width:1320px;margin:0 auto;padding:0 24px}.sec{padding-top:64px}
.top{background:var(--inv);color:var(--invt);font-size:13px;font-weight:600;padding:11px 24px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 32px;text-align:center}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:100;background:var(--bg);border-bottom:1px solid var(--line)}
.hr{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 28px;padding-top:14px;padding-bottom:6px}
.logo{display:flex;align-items:center;gap:10px;font-size:28px;font-weight:800;letter-spacing:-.03em}
.logo:hover{color:inherit}
.sb{flex:1 1 300px;max-width:540px;display:flex;align-items:center;background:var(--soft);border-radius:999px;padding:0 20px;min-height:46px}
.sb input{flex:1;border:0;background:transparent;font:inherit;font-size:14px;color:var(--fg);outline:none;min-height:44px}
nav{position:relative;display:flex;gap:0 28px;font-size:15px;font-weight:600}
.nl{min-height:48px;display:flex;align-items:center;position:relative;white-space:nowrap}
.nl::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:2px;background:var(--ac);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.ni:hover .nl::after,.ni:focus-within .nl::after{transform:scaleX(1)}
.mega{display:none;position:absolute;left:0;right:0;top:100%;background:var(--bg);border:1px solid var(--line);border-top:0;border-radius:0 0 20px 20px;box-shadow:0 28px 48px rgba(20,17,15,.18);padding:26px;z-index:60;gap:28px}
.ni:hover .mega,.ni:focus-within .mega{display:flex;animation:up .3s both}
.mc{flex:1;column-count:3;column-gap:28px}.ms{break-inside:avoid;padding-bottom:16px}
.ms a{display:block;font-size:14px;font-weight:500;padding:5px 0}
.ms .mh{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ac)}
.mp{width:240px;min-height:200px;flex:none;border-radius:16px;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;color:#33291f}
.mp:hover{color:#33291f}.mp u{font-size:13px;font-weight:700}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border:1px solid var(--bd);border-radius:999px;font:inherit;font-size:13px;font-weight:600;background:var(--bg);color:var(--fg);cursor:pointer;transition:.2s}
.chip:hover,.chip.on{background:var(--inv);color:var(--invt);border-color:var(--inv)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 28px;border-radius:999px;font:inherit;font-size:14px;font-weight:700;background:var(--inv);color:var(--invt);border:1.5px solid var(--inv);cursor:pointer;transition:.25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(0,0,0,.18);color:var(--invt)}
.btn.o{background:transparent;color:var(--fg)}.btn.o:hover{color:var(--fg)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.hero{background:var(--soft);overflow:hidden}
.hero .w{padding-top:56px;padding-bottom:56px;display:flex;flex-wrap:wrap;align-items:center;gap:40px}
.kick{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ac)}
.hg{flex:1 1 420px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,230px);gap:16px}
.ph{border-radius:20px;display:flex;align-items:flex-end;padding:18px;font-size:13px;font-weight:600;color:#4A4038;animation:fl 6s ease-in-out infinite}
.mq{background:var(--inv);color:var(--invt);overflow:hidden;padding:16px 0;font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.mq div{display:flex;width:max-content;animation:mq 30s linear infinite}.mq span{padding-right:40px;white-space:nowrap}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px;padding:28px 24px;border-bottom:1px solid var(--line)}
.trust div{border-left:3px solid var(--ac);padding-left:14px;font-weight:700;font-size:15px}.trust small{display:block;font-weight:500;font-size:13px;color:var(--mut)}
.gt{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:28px 20px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:24px}
.tile{display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding:18px;border-radius:16px;color:#33291f;font-weight:800;font-size:19px;letter-spacing:-.02em;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.tile:hover{transform:translateY(-6px);color:#33291f}.tile small{font-size:12px;font-weight:600;opacity:.8;letter-spacing:0}
.t45{aspect-ratio:4/5}.t169{aspect-ratio:16/9}
.cat{display:flex;flex-direction:column;gap:14px}.cat>a:nth-child(2){font-size:18px;font-weight:700}
.pc{display:flex;flex-direction:column;gap:10px;transition:transform .35s}.pc:hover{transform:translateY(-6px)}
.imw{position:relative}
.im{display:flex;align-items:flex-end;aspect-ratio:3/4;border-radius:16px;padding:14px;box-sizing:border-box;font-size:12px;font-weight:600;color:#4A4038}
.im:hover{color:#4A4038}
.tg{position:absolute;top:14px;left:14px;background:#fff;color:#14110F;font-size:12px;font-weight:700;border-radius:999px;padding:5px 12px}
.heart{position:absolute;top:8px;right:8px;width:44px;height:44px;border:0;border-radius:999px;background:rgba(255,255,255,.88);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s}
.heart:hover{transform:scale(1.12)}.heart svg{fill:none;stroke:#14110F;stroke-width:1.8}.heart.on svg{fill:#B4442A;stroke:#B4442A}
.pn{font-size:16px;font-weight:600}.pr{display:flex;gap:10px;align-items:baseline}.pr s{font-size:14px;color:var(--mut)}.pr em{font-style:normal;font-size:13px;color:var(--mut)}
.band{border-radius:24px;padding:48px 40px;display:flex;flex-direction:column;gap:12px;color:#33291f}
.band h1{font-size:56px;line-height:1.05}.band p{margin:0;font-size:17px;max-width:560px;line-height:1.55}
.crumb{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--mut);padding:20px 0}.crumb a:hover{text-decoration:underline}
.hd2{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.hd2 h2{font-size:34px}
.ban{display:flex;flex-wrap:wrap;gap:24px}.ban>a{flex:1 1 420px;min-height:400px;border-radius:24px;padding:40px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;color:#33291f}
.ban>a:hover{color:#33291f}.ban h3{font-size:34px;line-height:1.1;max-width:380px}
.rv{border:1.5px dashed var(--bd);border-radius:16px;padding:26px;min-height:140px;color:var(--mut);font-size:14px;line-height:1.5}.rv b{display:block;color:var(--fg);margin-bottom:8px}
.nlt{background:var(--inv);color:var(--invt);border-radius:24px;padding:52px 40px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px}
.nlt input{flex:1 1 220px;min-height:52px;border:0;border-radius:999px;padding:0 24px;font:inherit;box-sizing:border-box}
.ft{background:var(--soft);border-top:1px solid var(--line);margin-top:64px}
.ft .w{padding-top:52px;padding-bottom:32px;display:flex;flex-wrap:wrap;gap:40px}
.ft .c{flex:1 1 150px;display:flex;flex-direction:column}.ft .c b{margin-bottom:8px;font-size:14px}.ft .c a{font-size:14px;min-height:32px;display:flex;align-items:center}
.ft small{display:block;text-align:center;padding:20px;border-top:1px solid var(--line);color:var(--mut)}
.im.has{padding:0;overflow:hidden}.im img{width:100%;height:100%;object-fit:cover;display:block;border-radius:16px}
.logo img{height:46px;width:auto;display:block;background:#fff;border-radius:10px;padding:3px 8px}
.ft .logo img{height:60px}
.cnt{margin:0 0 20px;font-size:14px;color:var(--mut)}
.pager{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin:44px 0 8px}
.pgn{min-width:44px;height:44px;padding:0 16px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--bd);border-radius:999px;font-weight:700;font-size:14px;background:var(--bg);color:var(--fg);transition:.2s}
.pgn:hover{background:var(--soft);color:var(--fg)}
.pgn.on,.pgn.on:hover{background:var(--inv);color:var(--invt);border-color:var(--inv)}
.pgd{padding:0 4px;color:var(--mut)}
.ft .c .soc{display:flex;flex-direction:row;gap:10px;margin-top:6px}
.ft .c .soc a{width:44px;height:44px;min-height:44px;border-radius:999px;border:1px solid var(--bd);justify-content:center;transition:.2s}
.ft .c .soc a:hover{background:var(--inv);color:var(--invt);border-color:var(--inv)}
.soc svg{width:20px;height:20px}
a:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
@media(max-width:900px){nav{overflow-x:auto;scrollbar-width:none}.mega{display:none!important}.band h1{font-size:40px}.band{padding:32px 24px}.hg{grid-template-rows:repeat(2,160px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ MENU: centered + polished ============ */
nav{justify-content:center}
.nl{transition:color .25s;animation:navin .55s cubic-bezier(.2,.7,.2,1) both}
.ni:nth-child(1) .nl{animation-delay:.05s}.ni:nth-child(2) .nl{animation-delay:.10s}.ni:nth-child(3) .nl{animation-delay:.15s}
.ni:nth-child(4) .nl{animation-delay:.20s}.ni:nth-child(5) .nl{animation-delay:.25s}.ni:nth-child(6) .nl{animation-delay:.30s}
.ni:nth-child(7) .nl{animation-delay:.35s}.ni:nth-child(8) .nl{animation-delay:.40s}.ni:nth-child(9) .nl{animation-delay:.45s}
.nl::after{transform-origin:center;height:2.5px;border-radius:2px}
.ni:hover .nl{color:var(--ac)}
.ni:hover .ms{animation:up .45s cubic-bezier(.2,.7,.2,1) both}
.ni:hover .ms:nth-child(2){animation-delay:.06s}.ni:hover .ms:nth-child(3){animation-delay:.12s}.ni:hover .ms:nth-child(4){animation-delay:.18s}
.ni:hover .mp{animation:slin .5s cubic-bezier(.2,.7,.2,1) both}
.ms a{transition:padding-left .25s,color .25s}.ms a:not(.mh):hover{padding-left:8px}
.mp{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.mp:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 18px 34px rgba(0,0,0,.18)}
@media(max-width:900px){nav{justify-content:flex-start}}

/* ============ KEYFRAMES ============ */
@keyframes navin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes slin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes pin{from{opacity:0;transform:scale(.85) translateY(30px)}to{opacity:1;transform:none}}
@keyframes sw{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes bump{30%{transform:scale(1.18)}60%{transform:scale(.95)}}
@keyframes hb{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(217,169,79,.55)}50%{box-shadow:0 0 0 14px rgba(217,169,79,0)}}

/* ============ SCROLL REVEAL (all boxes) ============ */
.rvl.rvl{opacity:0;translate:0 36px;
 transition:opacity .75s ease,translate .75s cubic-bezier(.2,.7,.2,1),transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,padding-left .3s,border-color .3s,background .3s;
 transition-delay:var(--d,0s),var(--d,0s),0s,0s,0s,0s,0s}
.rvl.rvl.in{opacity:1;translate:0 0}

/* ============ HERO ============ */
.hero .w>div:first-child>*{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.hero .w>div:first-child>:nth-child(2){animation-delay:.08s}.hero .w>div:first-child>:nth-child(3){animation-delay:.16s}
.hero .w>div:first-child>:nth-child(4){animation-delay:.24s}.hero .w>div:first-child>:nth-child(5){animation-delay:.32s}
.hg .ph{position:relative;overflow:hidden;transition:scale .4s cubic-bezier(.2,.7,.2,1),box-shadow .4s;
 animation:pin .9s cubic-bezier(.2,.7,.2,1) backwards,fl 6s ease-in-out infinite}
.hg .ph:nth-child(1){animation-delay:.1s,1s}.hg .ph:nth-child(2){animation-delay:.25s,1.25s}.hg .ph:nth-child(3){animation-delay:.4s,1.4s}
.hg .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.4) 50%,transparent 65%);transform:translateX(-100%);animation:sw 4.5s ease-in-out infinite;pointer-events:none}
.hg .ph:nth-child(2)::after{animation-delay:1.2s}.hg .ph:nth-child(3)::after{animation-delay:2.4s}
.hg .ph:hover{scale:1.04;box-shadow:0 22px 40px rgba(15,26,51,.2)}

/* ============ TILES (categories / sections) ============ */
.tile{position:relative;overflow:hidden}
.tile>*{position:relative;z-index:1}
.tile::before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s ease;pointer-events:none}
.tile:hover::before{transform:translateX(120%)}
.tile:hover{transform:translateY(-8px) scale(1.015);box-shadow:0 22px 38px rgba(15,26,51,.18)}
.tile[href="#sale"]{animation:glow 2.6s ease-in-out infinite}
.cat>a:nth-child(2){transition:color .25s,letter-spacing .25s}.cat:hover>a:nth-child(2){color:var(--ac);letter-spacing:.01em}

/* ============ PRODUCT CARDS ============ */
.pc:hover{transform:translateY(-8px)}
.im{position:relative;overflow:hidden;transition:box-shadow .4s}
.im.has img{transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.pc:hover .im{box-shadow:0 20px 34px rgba(15,26,51,.18)}
.pc:hover .im.has img{transform:scale(1.08)}
.im:not(.has)::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-100%);animation:sw 3.4s ease-in-out infinite;pointer-events:none}
.tg{transition:transform .3s}.pc:hover .tg{transform:scale(1.08) rotate(-3deg)}
.heart.on svg{animation:hb .45s ease}
.pc .btn.o{transition:.25s}.pc .btn.o:hover{background:var(--inv);color:var(--invt)}

/* ============ BANNERS / BANDS / REVIEWS / TRUST / NEWSLETTER ============ */
.ban>a{position:relative;overflow:hidden;transition:transform .4s cubic-bezier(.2,.7,.2,1),box-shadow .4s}
.ban>a>*{position:relative;z-index:1}
.ban>a::before,.band::after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.35);top:-80px;right:-80px;transition:transform .8s cubic-bezier(.2,.7,.2,1);animation:fl 7s ease-in-out infinite;pointer-events:none}
.ban>a:hover::before{transform:scale(1.7)}
.ban>a:hover{transform:translateY(-8px);box-shadow:0 28px 46px rgba(15,26,51,.2)}
.ban>a:hover .btn{transform:translateX(6px)}
.band{position:relative;overflow:hidden}.band>*{position:relative;z-index:1}
.rv{transition:transform .35s,box-shadow .35s,border-color .3s,background .3s}
.rv:hover{transform:translateY(-6px);border-color:var(--ac);background:var(--soft);box-shadow:0 16px 30px rgba(15,26,51,.1)}
.trust>div:hover{padding-left:22px;border-left-color:var(--inv)}
.nlt{position:relative;overflow:hidden}.nlt>*{position:relative;z-index:1}
.nlt::before{content:"";position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(217,169,79,.4),transparent 65%);right:-70px;top:-90px;animation:fl 7s ease-in-out infinite;pointer-events:none}
.nlt::after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(217,169,79,.25),transparent 65%);left:-60px;bottom:-90px;animation:fl 9s ease-in-out infinite reverse;pointer-events:none}

/* ============ SMALL BITS ============ */
.chip:hover{transform:translateY(-2px)}
.btn:active,.chip:active{transform:scale(.96)}
#cart.bump{animation:bump .45s ease}
.ft .c a{transition:padding-left .25s,color .25s}.ft .c a:hover{padding-left:6px}
@media(prefers-reduced-motion:reduce){.rvl.rvl{opacity:1;translate:none}.hg .ph::after,.im:not(.has)::after{display:none}}

/* ============ MENU FIXES ============ */
nav.shut .mega{display:none!important}
.mb{display:none;min-height:44px;padding:0 18px;gap:8px;align-items:center}
.mb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
@media(max-width:900px),(hover:none){
 .mega{display:none!important}
 .mb{display:inline-flex}
 .hr{padding-top:10px}
 .sb{order:5;flex:1 1 100%;max-width:none}
 .logo{margin-right:auto}
}
.drw{position:fixed;inset:0;z-index:300;visibility:hidden;transition:visibility 0s .4s}
.drw.open{visibility:visible;transition-delay:0s}
.dov{position:absolute;inset:0;background:rgba(10,20,40,.55);opacity:0;transition:opacity .35s}
.drw.open .dov{opacity:1}
.dp{position:absolute;left:0;top:0;bottom:0;width:min(88vw,380px);background:var(--bg);color:var(--fg);transform:translateX(-102%);transition:transform .4s cubic-bezier(.2,.7,.2,1);overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));box-sizing:border-box;box-shadow:12px 0 40px rgba(0,0,0,.25)}
.drw.open .dp{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.dh b{font-size:20px;letter-spacing:-.02em}
.dx{width:44px;height:44px;border:0;border-radius:999px;background:var(--soft);color:var(--fg);font-size:16px;cursor:pointer}
.dd{border-bottom:1px solid var(--line)}
.dd summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;min-height:54px;font-weight:700;font-size:17px}
.dd summary::-webkit-details-marker{display:none}
.dd summary i{width:10px;height:10px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .3s;margin-right:6px}
.dd[open] summary i{transform:rotate(-135deg)}
.dd[open]>*:not(summary){animation:up .35s both}
.dp a{display:block;padding:9px 0;font-size:15px}
.dp .da{font-weight:700;color:var(--ac)}
.dp .ds{padding:6px 0 10px 14px;border-left:2px solid var(--line);margin:6px 0 10px 4px}
.dp .dsh{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding-bottom:4px}
.dp .dl{font-weight:700;font-size:17px;padding:14px 0;border-bottom:1px solid var(--line)}
.dfoot{padding-top:18px}.dfoot b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac);margin:14px 0 2px}
.dfoot a{padding:7px 0;color:var(--mut)}

/* ============ EMPTY STATE ============ */
.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:36px;border:1.5px dashed var(--bd);border-radius:20px;background:var(--soft)}
.empty b{font-size:20px}.empty span{color:var(--mut);font-size:14px}

/* ============ HELP & INFO PAGES ============ */
.ip{display:grid;grid-template-columns:250px minmax(0,1fr);gap:40px;align-items:start;margin-top:32px}
.side{position:sticky;top:calc(150px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:2px;padding:14px;border:1px solid var(--line);border-radius:20px;background:var(--soft)}
.side b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac);padding:12px 12px 4px}
.side b:first-child{padding-top:4px}
.side a{padding:10px 12px;border-radius:12px;font-weight:600;font-size:14px;transition:background .2s,color .2s,padding-left .2s}
.side a:hover{background:var(--bg);padding-left:16px}
.side a.on,.side a.on:hover{background:var(--inv);color:var(--invt);padding-left:12px}
.doc{min-width:0}
.doc section{padding-top:36px;scroll-margin-top:150px}
.doc>section:first-child,.doc>.kps+section{padding-top:36px}
.doc h2{font-size:28px;margin:0 0 14px}
.doc .sh3{font-size:18px;letter-spacing:-.01em;margin:26px 0 12px}
.doc p{line-height:1.75;color:var(--mut);margin:0 0 14px;font-size:16px}
.doc p b,.doc li b{color:var(--fg)}
.doc .lead{font-size:22px;line-height:1.5;color:var(--fg);font-weight:600;letter-spacing:-.01em}
.doc ul,.doc ol:not(.steps):not(.toc ol){margin:0 0 16px;padding-left:22px;color:var(--mut);line-height:1.75}
.doc li::marker{color:var(--ac)}
.doc a:not(.btn):not(.tile){color:var(--ac);text-decoration:underline;text-underline-offset:3px}
.doc a:not(.btn):not(.tile):hover{color:var(--fg)}
.mut{color:var(--mut)}
.cardx{border:1px solid var(--line);border-radius:20px;padding:22px;background:var(--bg)}
.cardx:hover{box-shadow:0 14px 30px rgba(15,26,51,.08)}
.kps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.kp{display:flex;flex-direction:column;gap:6px;transition:transform .35s}
.kp:hover{transform:translateY(-5px);border-color:var(--ac)}
.kp small{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ac)}
.kp b{font-size:22px;letter-spacing:-.02em;line-height:1.25;word-break:break-word}
.kp span{font-size:14px;color:var(--mut)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:s}
.steps li{display:flex;gap:18px;align-items:flex-start}
.steps i{flex:none;width:40px;height:40px;border-radius:50%;background:var(--inv);color:var(--invt);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;transition:transform .35s}
.steps li:hover i{transform:rotate(360deg) scale(1.08)}
.steps b{font-size:17px;display:block;margin:6px 0 4px}
.steps p{margin:0!important;font-size:15px!important}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:18px}
table{width:100%;border-collapse:collapse;min-width:420px}
th,td{padding:14px 18px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5}
thead th{background:var(--soft);font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
tbody th{font-weight:700}
tbody tr{transition:background .2s}tbody tr:hover{background:var(--soft)}
tbody tr:last-child>*{border-bottom:0}
.note{margin:18px 0;padding:18px 22px;border-radius:16px;background:var(--soft);border-left:4px solid var(--ac);font-size:14px;line-height:1.65;color:var(--mut)}
.note b{color:var(--fg)}.note ul{margin:8px 0 0!important}
.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.fc{padding:28px}.fc h2{font-size:24px!important;margin:0 0 8px!important}
.frm{display:grid;gap:16px;margin-top:16px}
.frm .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fld{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:700}
.fld input,.fld select,.fld textarea{font:inherit;font-size:15px;font-weight:500;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;min-height:48px;box-sizing:border-box;width:100%;transition:border-color .2s,box-shadow .2s}
.fld textarea{resize:vertical;min-height:120px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px rgba(148,105,31,.18)}
.msg{display:none;padding:14px 18px;border-radius:14px;background:var(--soft);border-left:4px solid var(--ac);font-size:14px;line-height:1.55}
.msg.show{display:block;animation:up .4s both}.msg.ok{border-left-color:#2E8B57}
.sztabs{align-items:center;margin-bottom:8px}.grow{flex:1}
.szbody.swap{animation:up .45s both}
.szbody h2{margin-top:20px}
.faqbar{display:flex;gap:12px;margin-top:4px}
.fq{padding:0;margin-bottom:12px;transition:border-color .3s,box-shadow .3s,transform .35s}
.fq[hidden]{display:none}
.fq.open{border-color:var(--ac);box-shadow:0 12px 28px rgba(15,26,51,.08)}
.fqb{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px;cursor:pointer;font-weight:700;font-size:16px;line-height:1.4}
.fqb:focus-visible{outline:2px solid var(--ac);outline-offset:-2px;border-radius:20px}
.fqb i{flex:none;position:relative;width:28px;height:28px;border-radius:50%;background:var(--soft);transition:background .3s,transform .3s}
.fqb i::before,.fqb i::after{content:"";position:absolute;left:8px;right:8px;top:13px;height:2px;background:var(--fg);border-radius:2px;transition:transform .3s,background .3s}
.fqb i::after{transform:rotate(90deg)}
.fq.open .fqb i{background:var(--inv);transform:rotate(180deg)}
.fq.open .fqb i::before,.fq.open .fqb i::after{background:var(--invt)}
.fq.open .fqb i::after{transform:rotate(0)}
.fqa{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.2,.7,.2,1)}
.fq.open .fqa{grid-template-rows:1fr}
.fqa>div{overflow:hidden}
.fqa p{margin:0!important;padding:0 24px 22px}
.qlinks{display:grid;gap:10px;margin-top:16px}
.qlinks a{display:flex;flex-direction:column;gap:2px;padding:14px 18px;border:1px solid var(--line);border-radius:14px;transition:.25s}
.qlinks a:hover{border-color:var(--ac);transform:translateX(6px);background:var(--soft)}
.qlinks span{font-size:13px;color:var(--ac);font-weight:600}
.toc b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac)}
.toc ol{margin:10px 0 0;padding-left:20px;columns:2;column-gap:32px;line-height:2}
.toc a{font-size:14px;font-weight:600}.toc a:hover{color:var(--ac)}
.ft small a{display:inline;min-height:0}.ft small a:hover{text-decoration:underline}
@media(max-width:900px){
 .ip{grid-template-columns:1fr;gap:20px}
 .side{position:static;flex-direction:row;overflow-x:auto;scrollbar-width:none;padding:10px;gap:6px}
 .side b{display:none}.side a{white-space:nowrap;padding:10px 14px}.side a:hover{padding-left:14px}
 .frm .two{grid-template-columns:1fr}.toc ol{columns:1}
 .doc h2{font-size:24px}.doc .lead{font-size:19px}
}
@media(max-width:520px){.mb span{display:none}.mb{padding:0 14px}.hr{gap:10px}.logo img{height:38px}#cart{padding:0 18px}}

const clamp=(p,n)=>Math.min(Math.max(p,1),Math.max(1,Math.ceil(n/PER)));
const rng=(p,n)=>{const a=(p-1)*PER;return[a,Math.min(a+PER,n)]};
const cnt=(p,n,st)=>{if(!n)return'';const[a,b]=rng(p,n);return `<p class="cnt"${st?` style="${st}"`:''}>Showing ${a+1}–${b} of ${n} product${n===1?'':'s'}${n>PER?` · Page ${p} of ${Math.ceil(n/PER)}`:''}</p>`};
function pager(base,p,n){const pages=Math.ceil(n/PER);if(pages<2)return'';
const href=k=>'#'+base+(k>1?'-pg'+k:''),set=new Set([1,pages,p-1,p,p+1]);
if(p<=3)[2,3,4].forEach(k=>set.add(k));if(p>=pages-2)[pages-1,pages-2,pages-3].forEach(k=>set.add(k));
let out='',prev=0;[...set].filter(k=>k>=1&&k<=pages).sort((a,b)=>a-b).forEach(k=>{if(prev&&k-prev>1)out+='<span class="pgd">…</span>';out+=`<a class="pgn${k===p?' on':''}" href="${href(k)}"${k===p?' aria-current="page"':''} aria-label="Page ${k}">${k}</a>`;prev=k});
return `<div class="pager" role="navigation" aria-label="Pagination">${p>1?`<a class="pgn" href="${href(p-1)}">‹ Prev</a>`:''}${out}${p<pages?`<a class="pgn" href="${href(p+1)}">Next ›</a>`:''}</div>`}

function faqFilter(){const q=(document.getElementById('faqq')||{value:''}).value.trim().toLowerCase(),c=(document.querySelector('[data-fc].on')||{dataset:{fc:'All'}}).dataset.fc;let n=0;
 document.querySelectorAll('.fq').forEach(el=>{const ok=(c==='All'||el.dataset.c===c)&&(!q||el.dataset.t.includes(q));el.hidden=!ok;if(ok)n++});
 const none=document.getElementById('faqnone');if(none)none.hidden=n>0}
document.addEventListener('input',e=>{if(e.target.id==='faqq')faqFilter()});
document.addEventListener('click',e=>{
 const fb=e.target.closest('.fqb');if(fb){const it=fb.parentElement,o=it.classList.toggle('open');fb.setAttribute('aria-expanded',o);return}
 const fc=e.target.closest('[data-fc]');if(fc){document.querySelectorAll('[data-fc]').forEach(b=>b.classList.toggle('on',b===fc));faqFilter();return}
 const sz=e.target.closest('[data-sz]');if(sz){SZSTATE.t=sz.dataset.sz;document.querySelectorAll('[data-sz]').forEach(b=>b.classList.toggle('on',b===sz));szDraw();return}
 const un=e.target.closest('[data-unit]');if(un){SZSTATE.u=un.dataset.unit;document.querySelectorAll('[data-unit]').forEach(b=>b.classList.toggle('on',b===un));szDraw();return}
 const tp=e.target.closest('[data-top]');if(tp){e.preventDefault();scrollTo({top:0,behavior:'smooth'})}
});
function szDraw(){const b=document.getElementById('szbody');if(b){b.innerHTML=szHtml();b.classList.remove('swap');void b.offsetWidth;b.classList.add('swap')}}
document.addEventListener('submit',e=>{const f=e.target;
 if(f.id==='trk'){e.preventDefault();const d=new FormData(f);window.open(CARR[d.get('c')]+encodeURIComponent(String(d.get('n')).replace(/\s+/g,'')),'_blank','noopener')}
 else if(f.id==='ord'){e.preventDefault();const m=document.getElementById('ordmsg');
  if(STORE.trackUrl){window.open(STORE.trackUrl,'_blank','noopener');return}
  m.textContent='Live order lookup is coming soon. Your shipping confirmation email has your tracking link, or contact us with your order number and we will look it up for you.';m.className='msg show'}
 else if(f.id==='cf'){e.preventDefault();const m=document.getElementById('cfmsg'),d=new FormData(f),say=(t,ok)=>{m.textContent=t;m.className='msg show'+(ok?' ok':'')};
  if(!f.checkValidity()){f.reportValidity();return}
  const body=`Name: ${d.get('name')}\nEmail: ${d.get('email')}\nOrder: ${d.get('order')||'-'}\n\n${d.get('message')}`;
  if(STORE.formEndpoint){fetch(STORE.formEndpoint,{method:'POST',headers:{Accept:'application/json'},body:d}).then(r=>{if(r.ok){f.reset();say('Thank you, your message has been sent. We will reply within '+STORE.replyTime+'.',1)}else say('Something went wrong. Please try again or email us directly.')}).catch(()=>say('Something went wrong. Please try again or email us directly.'))}
  else if(!ph(STORE.email)){location.href=`mailto:${STORE.email}?subject=${encodeURIComponent(d.get('topic'))}&body=${encodeURIComponent(body)}`;say('Your email app should open with your message ready to send.',1)}
  else say('Our contact form is being set up. Please check back soon.')}
});

const mbtn=document.getElementById('mbtn');
const drwSet=o=>{drw.classList.toggle('open',o);mbtn.setAttribute('aria-expanded',o);document.documentElement.style.overflow=o?'hidden':''};
mbtn.addEventListener('click',()=>drwSet(!drw.classList.contains('open')));

const RV='.cat,.pc,.rv,.ban>a,.nlt,.trust>div,.band,.hd2,.tile,.cardx,.doc>section,.tw,.note';let io;
function reveal(){
 const els=[...app.querySelectorAll(RV)].filter(e=>!e.parentElement.classList.contains('cat'));
 if(io)io.disconnect();
 if(!('IntersectionObserver' in window))return;
 io=new IntersectionObserver(en=>en.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12,rootMargin:'0px 0px -40px 0px'});
 els.forEach(e=>{const i=[...e.parentElement.children].filter(c=>c.matches(RV)).indexOf(e);e.style.setProperty('--d',(i%4)*.09+'s');e.classList.add('rvl');io.observe(e)});
}
function route(keep){let h=(location.hash||'#home').slice(1),page=1;const m=h.match(/-pg(\d+)$/);if(m){page=+m[1];h=h.slice(0,m.index)}
const p=h.split('-'),d=D.find(z=>z.id===p[0]);let o;
if(d){const s=d.secs.find(z=>z.id===p[1]);o=s?secPage(d,s,p[2],page):dept(d)}
else if(h==='new'||h==='sale')o=flat(h,page);else if(h==='search')o=search(page);
else if(p[0]==='info'&&PG[p[1]])o=infoPage(p[1]);
else o=home();
app.innerHTML=o;reveal();document.title=p[0]==='info'&&INFO[p[1]]?INFO[p[1]]+' | Avanaah':T0;if(!keep)scrollTo(0,0)}

const cartEl=document.getElementById('cart');
document.addEventListener('click',e=>{const t=e.target.closest('[data-add],.heart,[data-tab],[data-go]');if(!t)return;
if(t.hasAttribute('data-add')){cart++;cartEl.textContent='Cart ('+cart+')';cartEl.classList.remove('bump');void cartEl.offsetWidth;cartEl.classList.add('bump');t.textContent='Added ✓';setTimeout(()=>t.textContent='Quick add',1200)}
else if(t.classList.contains('heart'))t.classList.toggle('on');
else if(t.dataset.tab){tab=t.dataset.tab;route(true)}
else{const el=document.getElementById(t.dataset.go);if(el)el.scrollIntoView({behavior:'smooth'})}});
